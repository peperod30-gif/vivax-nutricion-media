name: router

# Router de Vivax Nutrición en la nube: lee lo que José pulsa en Telegram y publica en Instagram lo aprobado cuando llega su hora.
# Ver motor/nube/LEEME.md. Se entrega SIN el disparador automático: solo se puede lanzar a mano (workflow_dispatch).
# Para activarlo (cambio definitivo): parar el router del PC, migrar el estado y quitar el «#» de las dos líneas de `schedule`.
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: estado en la rama estado-prueba, Instagram simulado y sin leer ni escribir en Telegram"
        type: boolean
        default: true
  schedule:
    - cron: "2-57/5 * * * *"
    - cron: "1,16,31,46 * * * *"      # segunda línea desplazada: si GitHub se salta una de las dos, la otra cubre el hueco

permissions:
  contents: write
  actions: write          # para lanzar la siguiente pasada (el cron de GitHub puede tardar o saltarse arranques)

concurrency:
  group: router
  cancel-in-progress: false

jobs:
  pasada:
    runs-on: ubuntu-24.04
    timeout-minutes: 16          # sesión activa (hasta 9 min) + guardar el estado + la espera de la pasada encadenada
    env:
      PRUEBA: ${{ (github.event_name == 'workflow_dispatch' && inputs.prueba) && 'si' || 'no' }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: motor/nube/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -q -r motor/nube/requirements.txt

      - name: Bajar el estado
        id: bajar
        env:
          VIVAX_CLAVE_ESTADO: ${{ secrets.VIVAX_CLAVE_ESTADO }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRUEBA" = "si" ]; then RAMA=estado-prueba; else RAMA=estado; fi
          echo "RAMA=$RAMA" >> "$GITHUB_ENV"
          echo "Modo de prueba: $PRUEBA (rama de estado: $RAMA)"
          cd motor
          EXIGIR=""
          if [ "$PRUEBA" != "si" ]; then EXIGIR="--exigir"; fi
          python -X utf8 -m nube.estado bajar --rama "$RAMA" --datos "$RUNNER_TEMP/router_datos" $EXIGIR

      - name: Ejecutar una pasada del router
        id: ejecutar
        env:
          VIVAX_CLAVE_ESTADO: ${{ secrets.VIVAX_CLAVE_ESTADO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          IG_N1_TOKEN: ${{ secrets.IG_N1_TOKEN }}
          IG_N1_USER_ID: ${{ secrets.IG_N1_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          VIVAX_ENCADENAR: ${{ vars.ENCADENAR == 'no' && '0' || '1' }}      # la variable del repositorio ENCADENAR=no lo apaga todo
        run: |
          ARGS="--activo"          # modo activo: si José pulsa algo, sigue contestando al momento (ver motor/nube/UX.md)
          # La espera entre pasadas (antes un «sleep 235» al final) se hace escuchando Telegram: el primer toque de José se contesta en segundos.
          if [ "$VIVAX_ENCADENAR" = "1" ]; then ARGS="$ARGS --vigilia 235"; fi
          if [ "$PRUEBA" = "si" ]; then ARGS="--simulado --sin-telegram"; fi
          cd motor
          python -X utf8 -m nube.ejecutar_nube --datos "$RUNNER_TEMP/router_datos" $ARGS

      # Se guarda aunque la pasada haya fallado a medias: lo que ya se publicó o se aprobó tiene que constar para no repetirse.
      - name: Guardar el estado si cambió
        if: always() && steps.bajar.outcome == 'success'
        env:
          VIVAX_CLAVE_ESTADO: ${{ secrets.VIVAX_CLAVE_ESTADO }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd motor
          python -X utf8 -m nube.estado subir --rama "$RAMA" --datos "$RUNNER_TEMP/router_datos"

      # Cadena de seguridad: el cron de GitHub no garantiza hora ni arranque, así que cada pasada real, al terminar, espera y lanza la siguiente.
      # El cron se queda como segunda red. Se puede cortar poniendo la variable del repositorio ENCADENAR en «no».
      # La ejecución activa deja dos señales: «encadenada» (José estuvo usando Telegram y ya lanzó la siguiente al momento: aquí no se espera
      # ni se lanza otra) y «vigilia» (ya esperó escuchando a José: se lanza la siguiente sin dormir). Si no hay ninguna (la ejecución falló
      # antes), se hace lo de siempre: dormir 235 s y lanzar.
      - name: Encadenar la siguiente pasada
        if: always() && env.PRUEBA != 'si' && vars.ENCADENAR != 'no' && steps.ejecutar.outputs.encadenada != 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          VIGILIA: ${{ steps.ejecutar.outputs.vigilia }}
        run: |
          if [ "$VIGILIA" != "si" ]; then sleep 235; fi
          # la API de GitHub devuelve de vez en cuando un 500: sin reintentos, la cadena de pasadas se rompía (15-oct-2026, 21:21)
          for intento in 1 2 3 4 5 6; do
            if gh workflow run router.yml --repo "$GITHUB_REPOSITORY" -f prueba=false; then exit 0; fi
            echo "no se pudo lanzar la siguiente pasada (intento $intento de 6); espero y reintento"
            sleep 20
          done
          exit 1
